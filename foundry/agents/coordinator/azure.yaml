# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
name: chocolate-factory-coordinator
services:
    coordinator:
        project: src/coordinator
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: >-
            Coordinator for the FabCon chocolate factory demo -- routes
            each question to the Factory/Quality or Supply Chain/ERP
            specialist agent (or both, in sequence, for cross-domain
            questions) over direct A2A HTTP calls, then synthesizes the
            final answer. Replaces the single generalist "chocolate-factory-agent"
            as the public-facing agent name when enable_agent_split=true
            (infra/azure.tf); the old Prompt-kind generalist body is kept
            as build_definition_generalist() in deploy_foundry_agent.py,
            the fallback when the split is off.
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            # Feed the direct A2A calls in main.py -- AZURE_AI_ACCOUNT_NAME/
            # AZURE_AI_PROJECT_NAME are populated by azd provision (see
            # .azure/<env>/.env), same account/project FOUNDRY_PROJECT_ENDPOINT
            # above already points at.
            - name: AZURE_FOUNDRY_ACCOUNT_NAME
              value: ${AZURE_AI_ACCOUNT_NAME}
            - name: AZURE_FOUNDRY_PROJECT_NAME
              value: ${AZURE_AI_PROJECT_NAME}
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Streaming
        name: chocolate-factory-agent
        protocols:
            - protocol: responses
              version: 2.0.0
    ai-project:
        host: azure.ai.project
        deployments: []
        endpoint: https://aif-cacao-07499f0c.services.ai.azure.com/api/projects/chocolate-factory
infra:
    provider: microsoft.foundry
